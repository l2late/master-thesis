# enable color logging
defaults:
  - override hydra_logging: colorlog
  - override job_logging: colorlog

# output directory, generated dynamically on each run
# run_subdir: ${hydra.job.override_dirname}

run:
  dir: ${paths.log_dir}/${task_name}/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}
sweep:
  # dir: ${paths.log_dir}/${task_name}/multiruns/${experiment_name}/${now:%Y-%m-%d}_${now:%H-%M-%S}
  dir: ${paths.log_dir}/${task_name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
  # subdir: ${hydra.job.num}
  subdir: ${shorten_path:${hydra.job.override_dirname}}

# Fix: colorlog resets the filename to a relative path (known Hydra bug)
job_logging:
  handlers:
    file:
      filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
