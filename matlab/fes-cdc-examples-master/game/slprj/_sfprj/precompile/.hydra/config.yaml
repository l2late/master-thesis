dataset_size: null
window_size: 72
initial_horizon: 24
max_horizon: 24
horizon_scheduler_patience: 2
check_val_every_n_epoch: 5
task_name: train
tags:
- dev
tune: false
train: true
visualize_init_matrices: true
test: false
ckpt_path: null
resume_training: false
seed: 42
datamodule:
  _target_: infrastructure.lightning.datamodules.brcm_datamodule.BRCMTrajectoryLitDataModule
  csv_file: ${paths.data_dir}/brcm_simulation_results/raw/five_room_1_year_Ts_60_min_fully_random.csv
  batch_size: 2480
  size: ${dataset_size}
  window_size: ${window_size}
  initial_horizon: ${initial_horizon}
  max_horizon: ${max_horizon}
  num_workers: 0
  train_ratio: 0.3
  val_ratio: 0.3
model:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.01
    weight_decay: 0.0001
  dynamics:
    _target_: infrastructure.pytorch.modules.dynamics.LinearBuildingDynamics
    _partial_: true
    num_inputs: 5
    num_disturbances: 1
    constrain_A_negative_definite: false
    constrain_B_positive: false
    A_matrix_init_method: gershgorin
    B_matrix_init_method: random_positive
    nd_eps: 1.0e-06
  _target_: infrastructure.lightning.modules.neural_ode.LitMultiStepNeuralSSNODEModule
  horizon: ${initial_horizon}
  interpolation_method: zoh
  gru_lr: 0.001
  gru_weight_decay: 0.0001
  resistance_lr: 0.001
  resistance_weight_decay: 0.0001
  capacitance_lr: 0.01
  capacitance_weight_decay: 0.001
  solver_method: dopri5
  solver_rtol: 1.0e-06
  solver_atol: 1.0e-08
  kinetic_reg_coeff: 0.0
  jacobian_reg_coeff: 0.0
  lr_scheduler:
    _target_: torch.optim.lr_scheduler.ConstantLR
    _partial_: true
    factor: 1
    total_iters: ${trainer.max_epochs}
    last_epoch: -1
  num_mass_states_per_zone: 1
trainer:
  _target_: lightning.Trainer
  default_root_dir: ${paths.output_dir}
  min_epochs: 1
  max_epochs: 10000
  accelerator: gpu
  devices: 1
  gradient_clip_val: null
  enable_checkpointing: true
  check_val_every_n_epoch: ${check_val_every_n_epoch}
  log_every_n_steps: 5
  deterministic: false
paths:
  root_dir: ${oc.env:PROJECT_ROOT,.}
  data_dir: ${oc.env:DATA_ROOT,${paths.root_dir}/data}
  log_dir: ${paths.root_dir}/logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: epoch={epoch:04d}-val_multi_step_mse={val/multi_step_mse:.7f}
    monitor: val/multi_step_mse
    verbose: false
    save_last: true
    save_top_k: 3
    mode: min
    auto_insert_metric_name: false
    save_weights_only: false
    every_n_train_steps: null
    train_time_interval: null
    every_n_epochs: 5
    save_on_train_epoch_end: null
  learning_rate_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch
    log_momentum: false
  horizon_aware_early_stopping:
    monitor: val/trace_mse
    patience: 20
    min_delta: 1.0e-07
  horizon_curriculum_scheduler_callback:
    metric: val/multi_step_mse
logger:
  tensorboard:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    save_dir: ${paths.output_dir}/tensorboard/
    name: null
    log_graph: false
    default_hp_metric: false
    prefix: ''
