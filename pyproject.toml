[project]
name = "alphabuilding"
version = "0.1.0"
description = ""
requires-python = ">=3.10, <3.11"
# readme = "README.md"
dependencies = [
  "pandas==2.3.1",
  "numpy>=2,<3",
  "matplotlib>=3.8.3,<4",
  "lightning[extra]>=2.5.3,<3",
  "scipy>=1.14.0,<2",
  "mpmath>=1.3.0,<2",
  "scikit-learn>=1.6.0,<2",
  "torchdiffeq>=0.2.5,<0.3",
  "hydra-core>=1.3.2,<2",
  "pyrootutils>=1.0.4",
  "hydra-colorlog>=1.2.0",
  "torch==2.7.1",
  "geotorch>=0.3.0",
  "torchmetrics>=1.6.0",
  "joblib>=1.5.3",
  "iterfzf>=1.8.0.62.0",
  "pandera>=0.28.1",
  "pyarrow>=23.0.0",
  "einops>=0.8.1",
  "plotly>=6.5.2",
  "typeguard>=4.4.4",
  "beartype>=0.22.9",
  "optuna>=4.7.0",
  "optuna-integration>=4.7.0",
  "optuna-dashboard>=0.20.0",
  "setuptools<82",
  "questionary>=2.1.1",
  "jaxtyping>=0.3.7",
  "cvxpy>=1.7.3",
  "control>=0.10.2",
  # "gurobipy>=13.0.1",
  "wandb>=0.25.1",
  "hydra-joblib-launcher>=1.2.0",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }


[tool.hatch.build]
dev-mode-dirs = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "ipython>=8.37.0",
  "pytest>=8.0.0,<9",
  "hypothesis>=6.98.4,<7",
  "pytest-integration>=0.2.3,<0.3",
  "tensorboard>=2.20.0",
  "sippy-unipi>=1.0.1",
  "seaborn>=0.13.2",
  "tbparse>=0.0.9",
  "jupyterlab>=4.5.2",
  "jupyterlab-vim>=4.1.4",
  "pyside6>=6.10.1",
  "scalene>=2.1.4",
  "kaleido>=1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alphabuilding"]

[tool.pytest.ini_options]
addopts = [
  "-ra",              # report all
  "-q",               # quiet mode
  "--showlocals",     # print locals in tracebacks
  "--strict-markers", # unknown markers are errors
  "--strict-config",  # bad config is an error
]
xfail_strict = true # PP309: xfail tests must actually fail
filterwarnings = ["error"]
log_level = "INFO"
testpaths = ["tests"]
pythonpath = 'src'

[tool.ruff]
unfixable = ["F401"] # stop removing unused packages automatically
ignore = ["F501"]

[tool.basedpyright]
reportMissingTypeStubs = false
reportUnknownParameterType = false
reportImplicitOverride = false
reportUnknownVariableType = false
reportAny = false
reportExplicitAny = false
reportMissingTypeArgument = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportMissingParameterType = false
# reportUntypedClassDecorator = false
reportUnusedCallResult = false
reportUnannotatedClassAttribute = false
include = ["src", "tests"]
exclude = ["**/node_modules", "**/__pycache__"]
extraPaths = ["src", "./src"]
